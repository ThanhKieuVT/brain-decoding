[project]
name = "brain-decoding-research"
version = "0.0.0"
description = "Project 1 (Brain Decoding) và Project 3 (Gaze Guidance)"
requires-python = ">=3.10"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
